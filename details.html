<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ladizo - Product Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      .details-container {
        padding: 150px 20px 100px;
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        gap: 60px;
        align-items: flex-start;
      }
      .details-images {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .main-image-wrapper {
        width: 100%;
        height: 600px;
        border-radius: 8px;
        overflow: hidden;
      }
      .main-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .thumbnail-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
      }
      .thumbnail {
        height: 100px;
        cursor: pointer;
        border-radius: 4px;
        overflow: hidden;
        border: 2px solid transparent;
      }
      .thumbnail.active {
        border-color: var(--primary-color);
      }
      .thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .details-content {
        flex: 1;
      }
      .product-title {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }
      .product-price {
        font-size: 1.5rem;
        color: var(--primary-color);
        font-weight: 600;
        margin-bottom: 30px;
      }
      .product-description {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 40px;
        line-height: 1.8;
      }
      .add-to-cart-btn {
        width: 100%;
        padding: 18px;
        font-size: 1.1rem;
        text-align: center;
      }
      .quantity-selector {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        width: max-content;
        border-radius: 4px;
        overflow: hidden;
      }
      .quantity-selector button {
        background: #f9f9f9;
        border: none;
        padding: 10px 20px;
        font-size: 1.2rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .quantity-selector button:hover {
        background: #eee;
      }
      .quantity-selector input {
        width: 60px;
        text-align: center;
        border: none;
        border-left: 1px solid #ddd;
        border-right: 1px solid #ddd;
        font-size: 1.1rem;
        padding: 10px 0;
      }
      .quantity-selector input:focus {
        outline: none;
      }
      .suggested-products {
        margin-top: 80px;
        margin-bottom: 100px;
      }
      @media (max-width: 768px) {
        .details-container {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar scrolled">
      <div class="nav-container">
        <div class="logo">
          <a href="/"><img src="/logo.png" alt="Ladizo Logo" class="logo-img" /></a>
        </div>
        <div class="nav-links">
          <a href="/">Home</a>
          <a href="/#collections">Collections</a>
          <a href="/#about">About</a>
          <a href="/#contact">Contact</a>
        </div>
      </div>
    </nav>

    <!-- Details Section -->
    <section class="details-container">
      <div class="details-images">
        <div class="main-image-wrapper">
          <img id="mainImage" src="" alt="Product Image" />
        </div>
        <div class="thumbnail-grid" id="thumbnailGrid">
          <!-- Thumbnails injected by JS -->
        </div>
      </div>
      
      <div class="details-content">
        <h1 class="product-title" id="productTitle">Loading...</h1>
        <div class="product-price" id="productPrice"></div>
        <div class="product-description" id="productDesc"></div>
        <div class="quantity-selector">
          <button id="qtyMinus">-</button>
          <input type="number" id="qtyInput" value="1" min="1">
          <button id="qtyPlus">+</button>
        </div>
        <button class="btn btn-primary add-to-cart-btn" id="addToCartBtn">Add to Cart</button>
      </div>
    </section>

    <!-- Suggested Products -->
    <section class="suggested-products container">
      <h2 class="serif-heading" style="text-align:center;">Suggested Products</h2>
      <div style="width: 50px; height: 2px; background-color: var(--primary); margin: 0 auto 40px auto;"></div>
      <div class="suggested-grid" id="suggestedGrid">
        <!-- Suggested items injected by JS -->
      </div>
    </section>

    <script type="module" src="/src/details.ts"></script>
  </body>
</html>
